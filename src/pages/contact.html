<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio Book</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/book.css">
    <link rel="stylesheet" href="../styles/typography.css">
</head>
<body>
    <div class="page contact-page">
        <h1>Contact Me</h1>
        <p>If you would like to get in touch, please fill out the form below or reach out via email.</p>
        <form action="mailto:your-email@example.com" method="post" enctype="text/plain">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
        <p>Alternatively, you can reach me at: <a href="mailto:your-email@example.com">your-email@example.com</a></p>
    </div>
</body>
</html>
